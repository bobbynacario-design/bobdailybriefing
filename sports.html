<!DOCTYPE html>
<html lang="en">
<head>

<title>Sports Briefing</title>
<meta name="description" content="Public NBA and PBA fixtures, results, standings, momentum and watchlists. Framing only, not betting advice.">
<style>
:root{

  --txt:#e8eaed;--txt2:#aab2bd;--txt3:#6b7480;--gold:#c9a84c;--green:#2db87a;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1420px;margin:0 auto;padding:1.4rem 1rem 3rem}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--rim);padding-bottom:1rem;margin-bottom:1.3rem}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem}
h1{font-family:var(--serif);font-size:30px;font-weight:700;margin:0;line-height:1.1}
.sub{font-family:var(--mono);font-size:11px;color:var(--txt3);margin-top:.35rem}
.actions{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);border:1px solid var(--rim2);border-radius:20px;padding:.35rem .65rem;background:var(--bg2)}
.pill a{color:var(--gold);text-decoration:none}
.loading{font-family:var(--mono);font-size:12px;color:var(--txt3);text-align:center;padding:5rem 1rem}
.sports-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;margin-bottom:1rem}

.sports-kpi-value{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--txt);line-height:1.1}
.sports-kpi-sub{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:.3rem;line-height:1.5}
.sports-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:1rem;align-items:start}
.sports-panel{background:var(--bg2);border:1px solid var(--rim);border-radius:12px;padding:1rem 1.1rem;margin-bottom:1rem}

.sports-list{display:flex;flex-direction:column;gap:.7rem}
.sports-match{position:relative;border:1px solid var(--rim);border-radius:10px;background:var(--bg3);padding:.7rem .8rem .95rem 1rem;overflow:visible}
.sports-match:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.sports-match.live:before{background:var(--green)}
.sports-match.finished:before{background:var(--gold)}
.sports-match.pending:before{background:#F0A832}
.sports-match.pending .sports-match-meta{color:#F0A832}
.sports-match-meta{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin-bottom:.45rem}
.sports-teams{display:grid;grid-template-columns:minmax(120px,1fr) 72px minmax(120px,1fr);gap:.55rem;align-items:center;max-width:680px;margin:0 auto}
.sports-team{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--txt);line-height:1.25;min-width:0}
.sports-team.away{text-align:right}
.sports-score{font-family:var(--mono);font-size:17px;color:var(--gold);white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums}
.sports-note{font-size:12px;color:var(--txt2);line-height:1.55;margin-top:.55rem}

.sports-projection-main{font-size:12px;color:var(--txt2);line-height:1.55;flex:1 1 220px;min-width:0;overflow-wrap:anywhere}

.sports-prob-bar{display:flex;height:7px;border-radius:5px;overflow:hidden;background:var(--bg2);margin-top:.55rem;min-width:100%}

.sports-momentum-score{font-family:var(--mono);font-size:24px;color:var(--gold);line-height:1}
.sports-momentum-meta{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.5rem}
.sports-stat-chip{font-family:var(--mono);font-size:9px;color:var(--txt3);border:1px solid var(--rim);border-radius:20px;padding:2px 7px;background:var(--bg2);white-space:nowrap}
.sports-momentum-note{font-size:12px;line-height:1.55;color:var(--txt2)}
.rel-badge{display:inline-block;margin-top:.25rem;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:2px 7px;border:1px solid var(--rim2);color:var(--txt3)}
.rel-high{color:var(--green);border-color:rgba(45,184,122,.35);background:var(--green-dim)}

.rel-low{color:var(--red);border-color:rgba(232,92,92,.3);background:rgba(232,92,92,.1)}
.sports-audit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin-bottom:.8rem}
.sports-audit-card{background:var(--bg3);border:1px solid var(--rim);border-radius:10px;padding:.75rem .8rem}
.sports-audit-label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);margin-bottom:.25rem}
.sports-audit-value{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--txt);line-height:1.1}
.sports-audit-sub{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:.3rem;line-height:1.4}

.sports-series{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.7rem}
.sports-series-round{border-left:2px solid var(--gold);padding-left:.65rem;min-width:0}

.sports-team-profile{border-top:1px solid var(--rim2);padding-top:.8rem}.sports-team-profile h3{font-family:var(--serif);font-size:20px;margin:0 0 .65rem}

.sports-brief-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;padding:.25rem 0 1rem;border-bottom:1px solid var(--rim);margin-bottom:.8rem}.sports-brief-head h2{font-family:var(--serif);font-size:24px;line-height:1.15;margin:.15rem 0 0}.sports-brief-kicker,.sports-brief-phase{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3)}.sports-brief-phase{text-align:right;color:var(--gold)}
.sports-follow-settings{border-bottom:1px solid var(--rim);padding:.1rem 0 .9rem;margin-bottom:.2rem}.sports-follow-settings summary,.sports-league-details>summary{cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);list-style:none}.sports-follow-settings summary::-webkit-details-marker,.sports-league-details>summary::-webkit-details-marker{display:none}.sports-follow-settings summary:before,.sports-league-details>summary:before{content:'+';display:inline-block;width:1rem;color:var(--gold)}.sports-follow-settings[open] summary:before,.sports-league-details[open]>summary:before{content:'−'}.sports-follow-body{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:.9rem 0 .2rem}.sports-follow-group h3{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);margin:0 0 .5rem}.sports-follow-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3rem .7rem;max-height:190px;overflow:auto;padding-right:.4rem}.sports-follow-option{display:flex;align-items:flex-start;gap:.4rem;font-size:11px;color:var(--txt2);line-height:1.4;min-width:0}.sports-follow-option input{accent-color:var(--gold);margin-top:.15rem;flex:0 0 auto}
.sports-brief-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:1.5rem;align-items:start}.sports-brief-section{padding:1rem 0;border-bottom:1px solid var(--rim)}.sports-brief-title{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;margin-bottom:.75rem}.sports-brief-title h3{font-family:var(--serif);font-size:19px;line-height:1.2;margin:0}.sports-brief-count{font-family:var(--mono);font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em}.sports-next-list,.sports-change-list,.sports-followed-list{display:flex;flex-direction:column;gap:.55rem}.sports-next-item,.sports-team-brief,.sports-player-brief{border:1px solid var(--rim);background:var(--bg2);padding:.7rem .8rem}.sports-next-item{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:.7rem;align-items:center}.sports-next-time{font-family:var(--mono);font-size:10px;color:var(--gold);line-height:1.45}.sports-next-match{font-family:var(--serif);font-size:15px;font-weight:700;line-height:1.3;min-width:0}.sports-next-meta{font-family:var(--mono);font-size:9px;color:var(--txt3);margin-top:.2rem;line-height:1.45}.sports-next-flag{font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--green);white-space:nowrap}.sports-change{display:grid;grid-template-columns:70px minmax(0,1fr);gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--rim)}.sports-change:last-child{border-bottom:0}.sports-change-type{font-family:var(--mono);font-size:8px;letter-spacing:.07em;text-transform:uppercase;color:var(--gold)}.sports-change-title{font-size:12px;font-weight:700;color:var(--txt);line-height:1.45}.sports-change-detail{font-size:11px;color:var(--txt3);line-height:1.5;margin-top:.15rem}.sports-team-brief-top,.sports-player-brief-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.7rem}.sports-team-brief h4,.sports-player-brief h4{font-family:var(--serif);font-size:15px;line-height:1.25;margin:0}.sports-team-record{font-family:var(--mono);font-size:10px;color:var(--gold);white-space:nowrap}.sports-team-brief-meta,.sports-player-brief-meta{font-family:var(--mono);font-size:9px;color:var(--txt3);line-height:1.5;margin-top:.35rem}.sports-team-brief-next{font-size:11px;color:var(--txt2);line-height:1.5;margin-top:.45rem;padding-top:.45rem;border-top:1px solid var(--rim)}.sports-context{padding:1rem 0;border-bottom:1px solid var(--rim)}.sports-league-details{padding:1rem 0}.sports-league-details>summary span{color:var(--txt3);margin-left:.4rem;text-transform:none;letter-spacing:0}.sports-league-body{padding-top:1rem}.sports-league-body .sports-panel{border-radius:6px}.sports-offseason{font-size:12px;line-height:1.65;color:var(--txt2);border-left:3px solid var(--gold);padding:.65rem .8rem;background:rgba(201,168,76,.1);margin-bottom:.8rem}

.sports-ko-tracker{margin-bottom:1rem}

.sports-bracket-col{flex:0 0 178px;display:flex;flex-direction:column;gap:.55rem}
.sports-bracket-head{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);padding-bottom:.3rem;border-bottom:1px solid var(--rim2);margin-bottom:.15rem}

<body>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sportsIsPlayed(status){var s=String(status||'').toUpperCase();return s==='FINISHED'||s==='AWARDED'||s==='IN_PLAY'||s==='PAUSED'||s==='LIVE';}
function sportsIsPending(m){if(!m||typeof m!=='object')return false;var s=String(m.status||'').toUpperCase();if(sportsIsPlayed(s)||s==='CANCELLED'||s==='POSTPONED'||s==='SUSPENDED')return false;var t=m.utcDate?new Date(m.utcDate).getTime():NaN;return!isNaN(t)&&Date.now()>t+2.5*3600000;}
function sportsStatusClass(m){var status=(m&&typeof m==='object')?m.status:m;var s=String(status||'').toUpperCase();if(s==='LIVE'||s==='IN_PLAY'||s==='PAUSED')return'live';if(s==='FINISHED'||s==='AWARDED')return'finished';if(sportsIsPending(m))return'pending';return'';}
function sportsStatusLabel(m){if(sportsIsPending(m))return'Result pending';var status=(m&&typeof m==='object')?m.status:m;var s=String(status||'').replace(/_/g,' ').toLowerCase();return s?s.charAt(0).toUpperCase()+s.slice(1):'Scheduled';}
function sportsDate(v){if(!v)return'TBD';var d=new Date(v);if(isNaN(d.getTime()))return String(v);return d.toLocaleString('en-PH',{timeZone:'Asia/Manila',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' PHT';}
// pba.ph /recap gives a date but no tip-off time; those matches store
// timeKnown:false so we show the date alone instead of a noon placeholder.
function sportsDateOnly(v){if(!v)return'TBD';var d=new Date(v);if(isNaN(d.getTime()))return String(v);return d.toLocaleString('en-PH',{timeZone:'Asia/Manila',month:'short',day:'numeric'});}
function sportsMatchWhen(m){if(!m)return'TBD';return m.timeKnown===false?sportsDateOnly(m.utcDate||m.date):sportsDate(m.utcDate||m.date);}
function sportsFreshnessHtml(m){m=m||{};var last=m.lastSuccessfulAt||m.generatedAt||'',attempted=m.refreshAttemptedAt||m.generatedAt||'',ms=new Date(last).getTime(),age=isNaN(ms)?null:Math.max(0,(Date.now()-ms)/3600000),limit=Number(m.staleAfterHours||48),fallback=m.fallback||m.refreshStatus==='fallback',failed=m.refreshStatus==='error',stale=age!=null&&age>limit,cls=failed?' error':((fallback||stale)?' warn':''),status=failed?'REFRESH FAILED':(fallback?'FALLBACK SNAPSHOT':(stale?'STALE DATA':'DATA CURRENT')),detail=last?'Last successful refresh '+sportsDate(last)+'.':'No successful refresh has been recorded.';if(fallback&&attempted)detail+=' Latest attempt '+sportsDate(attempted)+' failed; retained data is shown.';if(stale)detail+=' Expected freshness window: '+limit+' hours.';return'<div class="sports-health'+cls+'"><b>'+esc(status)+'</b> / '+esc(detail)+'</div>';}
function sportsRestHtml(m){var rest=m&&m.rest;if(!rest)return'';function label(side,team){var row=rest[side]||{};if(row.days==null)return'';return'<span>'+esc(team||'')+': '+(row.backToBack?'<b>B2B</b>':esc(row.days+'d rest'))+'</span>';}var home=label('home',m.home),away=label('away',m.away);return home||away?'<div class="sports-rest">'+home+away+'</div>':'';}
function sportsBracketHtml(m,key){var rounds=(m&&m.bracket&&m.bracket.rounds)||[];if(!rounds.length)return'<div class="sports-empty">No '+esc(key==='pba'?'PBA elimination bracket':'active NBA playoff bracket')+' is published in the current provider window.</div>';return'<div class="sports-series">'+rounds.map(function(round){return'<div class="sports-series-round"><h4>'+esc(round.label||round.key||'Round')+'</h4>'+(round.series||[]).map(function(series){var hs=series.homeWins==null?'-':series.homeWins,as=series.awayWins==null?'-':series.awayWins;return'<div class="sports-series-row"><div class="sports-series-teams"><span>'+esc(series.home||'TBD')+' '+esc(hs)+'</span><span>'+esc(as)+' '+esc(series.away||'TBD')+'</span></div><div class="sports-series-summary">'+esc(series.summary||(series.completed?'Complete':'Scheduled'))+'</div></div>';}).join('')+'</div>';}).join('')+'</div>';}
function sportsSelectTeamProfile(select){var root=select&&select.closest('.sports-team-browser');if(!root)return;Array.prototype.forEach.call(root.querySelectorAll('[data-team-profile]'),function(profile){profile.style.display=profile.getAttribute('data-team-profile')===select.value?'block':'none';});}
function sportsProfileMatchLine(label,match){if(!match)return'<div class="sports-team-line"><b>'+esc(label)+':</b> None in current window</div>';return'<div class="sports-team-line"><b>'+esc(label)+':</b> '+esc((match.home||'TBD')+' '+sportsScore(match)+' '+(match.away||'TBD'))+' / '+esc(sportsMatchWhen(match))+'</div>';}
function sportsTeamProfilesHtml(m,key){var profiles=m&&m.teamProfiles||[];if(!profiles.length)return'<div class="sports-empty">Team profiles are unavailable from the current provider snapshot.</div>';var options=profiles.map(function(profile,idx){return'<option value="'+idx+'">'+esc(profile.team||'Team')+'</option>';}).join('');var panes=profiles.map(function(profile,idx){var record=profile.wins+'-'+profile.losses+(profile.points==null?'':' / '+profile.points+' pts'),margin=profile.margin==null?'-':((profile.margin>0?'+':'')+profile.margin),availability=(profile.availability||[]).map(function(row){return(row.player||'')+' ('+(row.status||'Unknown')+')';}).join(', ');return'<div class="sports-team-profile" data-team-profile="'+idx+'" style="display:'+(idx?'none':'block')+'"><h3>'+esc(profile.team||'')+'</h3><div class="sports-team-facts"><span>RECORD<br><b>'+esc(record)+'</b></span><span>MOMENTUM<br><b>'+esc((profile.momentumLabel||'-')+' '+(profile.momentumScore==null?'-':profile.momentumScore))+'</b></span><span>'+'AVG MARGIN'+'<br><b>'+esc(margin)+'</b></span><span>AVAILABILITY<br><b>'+esc(String(profile.availabilityCount||0))+'</b></span></div>'+sportsProfileMatchLine('Next',profile.next)+sportsProfileMatchLine('Latest',profile.latest)+(availability?'<div class="sports-team-line"><b>Availability:</b> '+esc(availability)+'</div>':'')+'</div>';}).join('');return'<div class="sports-team-browser"><select class="sports-team-select" onchange="sportsSelectTeamProfile(this)" aria-label="Select team">'+options+'</select>'+panes+'</div>';}
function sportsScore(m){if(!sportsIsPlayed(m&&m.status))return'vs';var s=m.score||{};if(s.home==null&&s.away==null)return'vs';return String(s.home==null?'-':s.home)+' - '+String(s.away==null?'-':s.away);}
function sportsProb(v){return Math.round((v||0)*100);}
function sportsProjectionHtml(m){
  var p=m&&m.projection;
  if(!p||!p.probs)return'';
  var pr=p.probs;
  var h=sportsProb(pr.home),dr=sportsProb(pr.draw),a=sportsProb(pr.away);
  var decisive=p.tag==='Strong edge'||p.tag==='Moderate edge';
  var cls=!p.favorite?'close':(decisive?'':'watch');
  var favPct=p.favorite===m.home?h:(p.favorite===m.away?a:Math.max(h,a));
  var eloBit=(p.homeElo!=null&&p.awayElo!=null)?' <span class="sports-elo">Elo '+p.homeElo+'-'+p.awayElo+'</span>':'';
  var splitText=(m.home||'')+' '+h+'% / draw '+dr+'% / '+(m.away||'')+' '+a+'%';
  var split='<span class="sports-projection-split">'+esc(m.home)+' '+h+'% / draw '+dr+'% / '+esc(m.away)+' '+a+'%'+eloBit+'</span>';
  var main;
  if(!p.favorite){
    main='<b>Too close to call</b>'+split;
  }else if(decisive){
    main='<b>Projected: '+esc(p.favorite)+' '+favPct+'%</b>'+split;
  }else{
    main='<b>Lean '+esc(p.favorite)+' '+favPct+'%</b> <span class="sports-lowconf">low confidence</span>'+split;
  }
  var bar='<div class="sports-prob-bar" title="'+esc(splitText)+'"><span class="seg home" style="width:'+h+'%"></span><span class="seg draw" style="width:'+dr+'%"></span><span class="seg away" style="width:'+a+'%"></span></div>';
  return'<div class="sports-projection'+(decisive?'':' low')+'"><div class="sports-projection-row"><div class="sports-projection-main">'+main+'</div><div class="sports-projection-tag '+cls+'">'+esc(p.tag)+'</div></div>'+bar+'</div>';
}
function sportsConfidentCalls(upcoming){var calls=(upcoming||[]).filter(function(m){var p=m.projection;return p&&p.favorite&&(p.tag==='Strong edge'||p.tag==='Moderate edge');}).map(function(m){var p=m.projection;var pct=sportsProb(p.favorite===m.home?p.probs.home:p.probs.away);return'<b>'+esc(p.favorite)+'</b> '+pct+'%';});if(!calls.length)return'';return'<div class="sports-confcalls">Confident calls: '+calls.slice(0,8).join(' / ')+'</div>';}
function sportsMatchCard(m){return'<div class="sports-match '+sportsStatusClass(m)+'"><div class="sports-match-meta"><span>'+esc(m.stage||m.group||'World Cup')+'</span><span>'+esc(sportsMatchWhen(m))+' / '+esc(sportsStatusLabel(m))+'</span></div><div class="sports-teams"><div class="sports-team">'+esc(m.home||'TBD')+'</div><div class="sports-score">'+esc(sportsScore(m))+'</div><div class="sports-team away">'+esc(m.away||'TBD')+'</div></div>'+(m.venue?'<div class="sports-note">'+esc(m.venue)+'</div>':'')+sportsRestHtml(m)+sportsProjectionHtml(m)+'</div>';}
function sportsKpi(label,value,sub){return'<div class="sports-kpi"><div class="sports-kpi-label">'+esc(label)+'</div><div class="sports-kpi-value">'+esc(value)+'</div><div class="sports-kpi-sub">'+esc(sub||'')+'</div></div>';}
function sportsTable(rows,empty,cols){if(!rows||!rows.length)return'<div class="sports-empty">'+esc(empty)+'</div>';return'<table class="sports-table"><thead><tr>'+cols.map(function(c){return'<th'+(c.num?' class="num"':'')+'>'+esc(c.h)+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return'<tr>'+cols.map(function(c){return'<td'+(c.num?' class="num"':'')+'>'+esc(c.v(r))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';}
function sportsMomentumClass(label){var l=String(label||'').toLowerCase();if(l==='rising')return'rising';if(l==='watch')return'watch';if(l==='fading')return'fading';return'';}
function sportsMomentumCard(t){return'<div class="sports-momentum-card '+sportsMomentumClass(t.label)+'"><div class="sports-momentum-top"><div><div class="sports-momentum-team">'+esc(t.team)+'</div><span class="rel-badge '+(t.label==='RISING'?'rel-high':(t.label==='FADING'?'rel-low':'rel-med'))+'">'+esc(t.label||'STEADY')+'</span></div><div class="sports-momentum-score">'+esc(t.score==null?'-':t.score)+'</div></div><div class="sports-momentum-meta"><span class="sports-stat-chip">Form '+esc(t.recentForm||'-')+'</span><span class="sports-stat-chip">GD3 '+esc((t.goalDiffTrend>0?'+':'')+(t.goalDiffTrend||0))+'</span><span class="sports-stat-chip">GF '+esc(t.attackRate==null?'-':t.attackRate+'/m')+'</span><span class="sports-stat-chip">GA '+esc(t.defenseRate==null?'-':t.defenseRate+'/m')+'</span></div><div class="sports-momentum-note">'+esc(t.note||'')+'</div></div>';}
function sportsMomentumRows(wc,baseLimit){var momentum=(wc&&wc.momentum)||[];var rows=momentum.slice(0,baseLimit||10);var seen={};var byTeam={};rows.forEach(function(r){if(r&&r.team)seen[r.team]=true;});momentum.forEach(function(r){if(r&&r.team)byTeam[r.team]=r;});((wc&&wc.upcoming)||[]).forEach(function(m){[m.home,m.away].forEach(function(team){if(team&&team!=='TBD'&&byTeam[team]&&!seen[team]){rows.push(byTeam[team]);seen[team]=true;}});});return rows;}
function sportsTeamKey(s){return String(s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim();}
function sportsMarketTeam(m){var label=String(m.label||m.question||'');var mm=label.match(/^(?:will\s+)?(.+?)\s+win(?:s)?\s+(?:the\s+)?(?:2026\s+)?(?:fifa\s+)?world cup/i);return mm?mm[1].trim():'';}
function sportsPct(v){return v==null?'-':(v*100).toFixed(1)+'%';}
function sportsMarketRead(gap){if(gap==null)return'NO MATCH';if(gap>=0.04)return'FORM AHEAD';if(gap<=-0.04)return'MARKET AHEAD';return'IN LINE';}
function sportsAuditPct(v){return v==null?'-':(v*100).toFixed(0)+'%';}
function sportsAuditCard(label,value,sub){return'<div class="sports-audit-card"><div class="sports-audit-label">'+esc(label)+'</div><div class="sports-audit-value">'+esc(value)+'</div><div class="sports-audit-sub">'+esc(sub||'')+'</div></div>';}
function sportsProjectionJournalHtml(wc){var j=wc.projectionJournal||{};if(!j.evaluated){return'<div class="sports-empty">Projection audit starts once there are completed matches with prior form to compare against.</div>';}var recent=j.recent||[];var rates=j.accuracyRates||[];var html='<div class="sports-audit-grid">'+sportsAuditCard('Decisive accuracy',sportsAuditPct(j.decisiveAccuracy),(j.decisiveAligned||0)+'/'+(j.decisive||0)+' strong/moderate right')+sportsAuditCard('All-lean accuracy',sportsAuditPct(j.accuracy),(j.aligned||0)+'/'+(j.projected||0)+' favorite leans right')+sportsAuditCard('Watch-only',sportsAuditPct(j.watchOnlyAccuracy),(j.watchOnlyAligned||0)+'/'+(j.watchOnly||0)+' weak leans right')+sportsAuditCard('Toss-ups',String(j.tossUps||0),(j.tossUpDraws||0)+' finished as draws')+'</div>';if(j.brier!=null){var bsk=j.brierSkill;var bcol=bsk==null?'var(--txt3)':(bsk>0.02?'var(--green)':(bsk<-0.02?'var(--red)':'var(--txt3)'));var bverdict=bsk==null?'':(bsk>0.02?'edge over base rate':(bsk<-0.02?'below base rate':'about at base rate'));html+='<div class="pse-caveat" style="margin-top:.2rem">Win/draw/loss probabilities / '+(j.probScored||0)+' scored / Brier '+j.brier+' vs base-rate '+j.baselineBrier+' / <span style="color:'+bcol+'">skill '+(bsk>0?'+':'')+bsk+(bverdict?' ('+bverdict+')':'')+'</span> / log-loss '+j.logLoss+' vs '+j.baselineLogLoss+'</div>';}if(rates.length){html+='<div class="sports-panel-title" style="margin-top:.85rem">Accuracy by confidence</div>'+sportsTable(rates,'No confidence buckets yet.',[{h:'Bucket',v:function(r){return r.tag||'';}},{h:'Rate',num:true,v:function(r){return sportsAuditPct(r.accuracy);}},{h:'Aligned',num:true,v:function(r){return(r.aligned||0)+'/'+(r.evaluated||0);}},{h:'Metric',v:function(r){return r.metric||'favorite alignment';}}]);}html+=sportsTable(recent,'No recent projection outcomes yet.',[{h:'Match',v:function(r){return(r.home||'')+' '+(r.score||'')+' '+(r.away||'');}},{h:'Projected',v:function(r){return r.projected||'-';}},{h:'Result',v:function(r){return r.result||'-';}},{h:'Tag',v:function(r){return r.tag||'-';}},{h:'Aligned',num:true,v:function(r){return r.aligned?'YES':'NO';}}]);html+='<div class="sports-empty" style="margin-top:.55rem">'+esc(j.note||'Point-in-time audit using only pre-match information.')+'</div>';return html;}
function sportsMarketLens(wc,miro){var momentum=wc.momentum||[];var markets=(miro&&miro.markets||[]).filter(function(m){return String(m.theme||'').toLowerCase()==='sports'&&sportsMarketTeam(m);});if(!markets.length)return'<div class="sports-empty">No World Cup outright markets loaded yet. Refresh the Markets feed to populate this lens.</div>';var byTeam={};momentum.forEach(function(t){byTeam[sportsTeamKey(t.team)]=t;});var rows=markets.map(function(m){var team=sportsMarketTeam(m);return{market:m,team:team,momentum:byTeam[sportsTeamKey(team)]||null};}).filter(function(r){return r.momentum&&r.market.impliedYes!=null;});if(!rows.length)return'<div class="sports-empty">World Cup markets loaded, but team names did not match the Sports momentum feed.</div>';function modelStrength(r){var t=r.momentum;return Math.max(0,(t.power!=null?t.power:t.score)||0);}var sumModel=rows.reduce(function(a,r){return a+modelStrength(r);},0)||1;var sumImplied=rows.reduce(function(a,r){return a+Math.max(0,r.market.impliedYes||0);},0)||1;rows.forEach(function(r){r.modelShare=modelStrength(r)/sumModel;r.marketShare=Math.max(0,r.market.impliedYes||0)/sumImplied;r.gap=r.modelShare-r.marketShare;r.read=sportsMarketRead(r.gap);});rows.sort(function(a,b){return Math.abs(b.gap||0)-Math.abs(a.gap||0);});return sportsTable(rows,'No matched market rows.',[{h:'Team',v:function(r){return r.team;}},{h:'Outright',num:true,v:function(r){return sportsPct(r.market.impliedYes);}},{h:'Model',num:true,v:function(r){return sportsPct(r.modelShare);}},{h:'Market',num:true,v:function(r){return sportsPct(r.marketShare);}},{h:'Gap',num:true,v:function(r){return r.gap==null?'-':((r.gap>0?'+':'')+(r.gap*100).toFixed(1)+' pts');}},{h:'Read',v:function(r){return r.read;}}])+'<div class="sports-empty" style="margin-top:.55rem"><b>Outright</b> is the raw implied price from the Markets feed (these '+rows.length+' teams sum to '+sportsPct(sumImplied)+', not 100% — most of the field has no market). <b>Model</b> (Elo + recent form) and <b>Market</b> are those re-based to a share within just these teams so both sum to 100% — that is why Market differs from Outright, and it makes the <b>Gap</b> like-for-like. A comparison lens, not a true win probability.</div>';}
// Knockout bracket + remaining-teams tracker (mirror of index.html). Pure render

function tennisNotable(m,bestOf){if(m.status!=='FINISHED')return null;var ps=m.players||[];var w=ps.filter(function(p){return p.winner;})[0],l=ps.filter(function(p){return!p.winner;})[0];if(!w||!l)return null;if(w.seed!=null&&l.seed!=null&&w.seed>l.seed)return{kind:'upset',txt:'Upset · ['+w.seed+'] beat ['+l.seed+']'};if(w.seed==null&&l.seed!=null)return{kind:'upset',txt:'Upset · unseeded beat ['+l.seed+']'};var sets=Math.max.apply(null,ps.map(function(p){return(p.sets||[]).filter(function(s){return s.g!=null;}).length;}).concat([0]));if(bestOf===5&&sets>=5)return{kind:'thriller',txt:'5-set epic'};if(bestOf===3&&sets>=3)return{kind:'thriller',txt:'Final-set decider'};return null;}
function tennisProjHtml(m){var p=m.proj;if(!p||m.status==='FINISHED')return'';var pa=Math.round(p.a*100),pb=100-pa;var decisive=p.tag==='Strong'||p.tag==='Moderate';var label=p.tag==='Toss-up'?('Toss-up '+Math.max(pa,pb)+'%'):((decisive?'Proj ':'Lean ')+esc(p.favorite)+' '+p.favPct+'%');return'<div class="t-proj'+(decisive?'':' low')+'"><div class="t-proj-txt">'+label+'</div><div class="t-proj-bar" title="'+esc((m.players[0]||{}).name||'')+' '+pa+'% / '+esc((m.players[1]||{}).name||'')+' '+pb+'%"><span class="pa" style="width:'+pa+'%"></span><span class="pb" style="width:'+pb+'%"></span></div></div>';}
function tennisMatchCard(m,bestOf){var played=m.status==='FINISHED';var label=played?'Result':(m.status==='LIVE'?'Live':'Scheduled');var players=m.players||[];var n=tennisNotable(m,bestOf);var flag=n?'<div class="sports-bm-flag '+n.kind+'">'+esc(n.txt)+'</div>':'';return'<div class="sports-bm'+(m.status==='LIVE'?' live':'')+(n?' notable':'')+'"><div class="sports-bm-meta"><span>'+esc(sportsMatchWhen(m))+'</span><span>'+esc(label)+'</span></div>'+tennisPlayerRow(players[0],played)+tennisPlayerRow(players[1],played)+flag+tennisProjHtml(m)+'</div>';}
function tennisBracket(draw,bestOf){if(!draw||!(draw.rounds||[]).length)return'<div class="sports-empty">The draw appears here once ESPN posts the bracket for this event.</div>';var cols=draw.rounds.map(function(r){var done=r.matches.filter(function(m){return m.status==='FINISHED';}).length;return'<div class="sports-bracket-col"><div class="sports-bracket-head">'+esc(r.name)+'<span>'+done+'/'+r.matches.length+'</span></div>'+r.matches.map(function(m){return tennisMatchCard(m,bestOf);}).join('')+'</div>';}).join('');return'<div class="sports-bracket-scroll"><div class="sports-bracket">'+cols+'</div></div>';}
function tennisNotableStrip(draw,bestOf){if(!draw)return'';var items=[];(draw.rounds||[]).forEach(function(r){r.matches.forEach(function(m){var n=tennisNotable(m,bestOf);if(!n)return;var w=(m.players||[]).filter(function(p){return p.winner;})[0],l=(m.players||[]).filter(function(p){return!p.winner;})[0];if(w&&l)items.push({n:n,round:r.name,w:w.name,l:l.name});});});if(!items.length)return'';items.sort(function(a,b){return(a.n.kind==='upset'?0:1)-(b.n.kind==='upset'?0:1);});var rows=items.slice(0,6).map(function(it){return'<div class="t-note"><span class="t-note-flag '+it.n.kind+'">'+esc(it.n.txt)+'</span><span class="t-note-txt"><b>'+esc(it.w)+'</b> beat '+esc(it.l)+'</span><span class="t-note-rd">'+esc(it.round)+'</span></div>';}).join('');return'<div class="sports-panel-title" style="margin-top:.4rem">Notable results — what to notice</div><div class="t-notes">'+rows+'</div>';}
function tennisTourAvail(t){var out=[];if(t&&t.draws&&t.draws.men)out.push('men');if(t&&t.draws&&t.draws.women)out.push('women');return out;}
function tennisTierView(tier,isSlam){tier=tier||{};var events=[];var cur=tier.current||tier.next;if(cur)events.push(cur);(tier.recent||[]).forEach(function(r){if(!cur||r.id!==cur.id)events.push(r);});if(!events.length)return'<div class="sports-empty">No current, upcoming or recent event in the provider window.</div>';var t=events.filter(function(e){return e.id===tennisEvent;})[0]||events.filter(function(e){return e.status==='live';})[0]||events.filter(function(e){return e.status==='completed';})[0]||events[0];var chips=events.map(function(e){var badge=e.status==='live'?'live':(e.status==='upcoming'?('in '+(e.countdownDays!=null?e.countdownDays+'d':'—')):'done');return'<button class="sports-tourn-chip '+e.status+(e===t?' active':'')+'" onclick="sportsShowTennisEvent(\''+esc(e.id)+'\')">'+esc(e.name)+'<span>'+esc(badge)+'</span></button>';}).join('');var html='<div class="sports-tourn-chips">'+chips+'</div>';var when=t.status==='upcoming'?('Starts '+esc(sportsDate(t.startDate))+(t.countdownDays!=null?' · in '+t.countdownDays+' day'+(t.countdownDays===1?'':'s'):'')):(t.status==='live'?'In progress':'Completed');html+='<div class="sports-tennis-head"><div><div class="sports-tennis-name">'+esc(t.name)+'</div><div class="sports-tennis-meta">'+esc([t.surface,t.tour==='combined'?'ATP + WTA':t.tour].filter(Boolean).join(' · '))+'</div></div><div class="sports-tennis-when">'+when+'</div></div>';var avail=tennisTourAvail(t);var tour=avail.indexOf(tennisTour)>=0?tennisTour:(avail[0]||'men');if(avail.length>1){html+='<div class="sports-tour-switch"><button class="sports-seg'+(tour==='men'?' active':'')+'" onclick="sportsShowTennisTour(\'men\')">ATP · Men</button><button class="sports-seg'+(tour==='women'?' active':'')+'" onclick="sportsShowTennisTour(\'women\')">WTA · Women</button></div>';}else if(avail.length===1){html+='<div class="sports-tour-switch"><button class="sports-seg active">'+(avail[0]==='men'?'ATP · Men':'WTA · Women')+'</button></div>';}var bestOf=(isSlam&&tour==='men')?5:3;var draw=t.draws&&t.draws[tour];html+=tennisNotableStrip(draw,bestOf);html+=tennisBracket(draw,bestOf);return html;}
function tennisJournalHtml(j){if(!j)return'';var head='<div class="sports-panel-title" style="margin-top:.7rem">Projection accuracy — grading the model</div>';if(!j.resolved)return head+'<div class="sports-empty">Accrues as scheduled matches resolve. Each projection is locked when first shown and scored when the match finishes — nothing graded with hindsight.</div>';var skill=j.brierSkill==null?'—':((j.brierSkill>0?'+':'')+j.brierSkill);var html=head+'<div class="sports-audit-grid">'+sportsAuditCard('Picks scored',j.resolved+(j.pending?' / '+j.pending+' open':''),'locked when shown')+sportsAuditCard('Decisive hit rate',j.decisiveAccuracy==null?'n/a':j.decisiveAccuracy+'%',j.decisive+' Moderate/Strong')+sportsAuditCard('All-pick hit rate',j.accuracy==null?'n/a':j.accuracy+'%','every projected match')+sportsAuditCard('Brier',j.brier==null?'n/a':j.brier,'vs 0.25 · skill '+skill)+'</div>';if(j.byTag&&j.byTag.length)html+=sportsTable(j.byTag,'',[{h:'Confidence',v:function(r){return r.tag;}},{h:'N',num:true,v:function(r){return r.n;}},{h:'Hit rate',num:true,v:function(r){return r.accuracy==null?'—':r.accuracy+'%';}}]);if(j.recent&&j.recent.length)html+=sportsTable(j.recent,'',[{h:'Call',v:function(r){return r.favorite+' '+r.favPct+'%';}},{h:'Event',v:function(r){return r.tournament+' · '+r.round;}},{h:'Winner',v:function(r){return r.winner;}},{h:'Result',v:function(r){return r.correct?'HIT':'MISS';}}]);html+='<div class="sports-empty" style="margin-top:.5rem">Forward journal: locked when shown, scored at resolution. Brier vs a 50/50 baseline (0.25). Model framing, not advice.</div>';return html;}
function sportsTennisHtml(mod){mod=mod||{};var tiers=mod.tiers||{slam:{},masters:{},tour500:{}};var html='<div class="sports-brief-head"><div><div class="sports-brief-kicker">Public briefing</div><h2>'+esc(mod.title||'Tennis — Majors & Masters')+'</h2></div><div class="sports-brief-phase">'+esc(mod.phase||'setup')+'<br>'+esc(mod.asOf||'')+'</div></div>';html+=sportsFreshnessHtml(mod);function live(k){return tiers[k]&&tiers[k].current&&tiers[k].current.status==='live';}var liveTier=live('slam')?'slam':(live('masters')?'masters':(live('tour500')?'tour500':null));var valid={slam:1,masters:1,tour500:1};var tier=valid[tennisTier]?tennisTier:(liveTier||'slam');html+='<div class="sports-subtabs"><button class="sports-module-tab'+(tier==='slam'?' active':'')+'" onclick="sportsShowTennisTier(\'slam\')">Grand Slams</button><button class="sports-module-tab'+(tier==='masters'?' active':'')+'" onclick="sportsShowTennisTier(\'masters\')">Masters 1000</button><button class="sports-module-tab'+(tier==='tour500'?' active':'')+'" onclick="sportsShowTennisTier(\'tour500\')">ATP / WTA 500</button></div>';var tierData=tier==='masters'?tiers.masters:(tier==='tour500'?tiers.tour500:tiers.slam);html+=tennisTierView(tierData,tier==='slam');html+=tennisJournalHtml(mod.projectionJournal);if(mod.providerNote)html+='<div class="sports-empty" style="margin-top:.6rem">'+esc(mod.providerNote)+'</div>';return html;}
// ESPN flips NBA offseason -> preseason months before games resume, so gating on
// 'offseason' alone dropped the explainer while the figures on screen are still
// last season's finals. Mirrors sportsPhaseNote in index.html.
function sportsPhaseNote(m,key){
  var phase=String(m.phase||'').toLowerCase();
  if(phase!=='offseason'&&phase!=='preseason')return '';
  var league=key==='pba'?'PBA':'NBA';
  var next=(m.upcoming||[]).slice().sort(function(a,b){return String(a.utcDate).localeCompare(String(b.utcDate));})[0];
  var note=league+' is in '+phase+'. Standings, momentum and form below are final figures from the last completed season, not current-season results. ';
  note+=next?'First scheduled fixture: '+sportsDate(next.utcDate)+'.':'Live fixtures will return when the provider publishes the next schedule; completed-season data remains in League details.';
  return '<div class="sports-offseason">'+esc(note)+'</div>';
}
function sportsGenericModuleHtml(d){
  var mods=d.modules||{},key=mods.nba?'nba':(mods.pba?'pba':Object.keys(mods)[0]),m=mods[key]||{};
  var title=m.title||(key==='pba'?'PH Local Pulse':'NBA Momentum Radar');
  var html='<div class="sports-brief-head"><div><div class="sports-brief-kicker">Personal briefing</div><h2>'+esc(title)+'</h2></div><div class="sports-brief-phase">'+esc(m.phase||'setup')+'<br>'+esc(m.asOf||'')+'</div></div>';
  html+=sportsPhaseNote(m,key);
  html+=sportsFreshnessHtml(m);
  html+=sportsFollowSettingsHtml(m,key);
  html+='<div class="sports-brief-grid"><div><section class="sports-brief-section"><div class="sports-brief-title"><h3>Next Up</h3><span class="sports-brief-count">'+(m.upcoming||[]).length+' scheduled</span></div>'+sportsNextUpHtml(m,key)+'</section><section class="sports-brief-section"><div class="sports-brief-title"><h3>Since Last Update</h3><span class="sports-brief-count">'+esc((m.changes&&m.changes.since)?sportsDate(m.changes.since):'baseline')+'</span></div>'+sportsChangesHtml(m,key)+'</section></div><div><section class="sports-brief-section"><div class="sports-brief-title"><h3>My Teams</h3><span class="sports-brief-count">followed</span></div>'+sportsMyTeamsHtml(m,key)+'</section><section class="sports-brief-section"><div class="sports-brief-title"><h3>My Players</h3><span class="sports-brief-count">followed</span></div>'+sportsMyPlayersHtml(m,key)+'</section></div></div>';
  html+='<section class="sports-context"><div class="sports-brief-title"><h3>Competition Context</h3><span class="sports-brief-count">current table</span></div>'+sportsContextHtml(m,key)+'</section>';
  return html+sportsLeagueDetailsHtml(m,key);
}
function renderSports(d){sportsStandaloneData=d;var out=document.getElementById('sports-out'),sub=document.getElementById('sports-sub');if(!d||(!d.worldCup&&!d.modules)){out.innerHTML='<div class="loading">No sports data yet. Run sports/refresh-sports.js.</div>';return;}var requested=new URLSearchParams(location.search).get('module'),active=d.modules&&d.modules.pba&&(d.modules.pba.upcoming||[]).length?'pba':(d.modules&&Object.keys(d.modules).find(function(k){var m=d.modules[k]||{};return(m.upcoming||[]).length&&String(m.phase||'').toLowerCase()!=='offseason';})),key=requested&&d.modules&&d.modules[requested]?requested:(active||(d.modules&&d.modules.nba?'nba':null)),selected=key&&d.modules[key],renderDoc=d;if(selected){var only={};only[key]=selected;renderDoc=Object.assign({},d,{modules:only});}document.getElementById('page-title').textContent=(selected&&selected.title)||(d.worldCup&&d.worldCup.name)||'Sports';sub.textContent=(d.title||'Sports briefing')+' / as of '+(d.asOf||d.generatedAt||'-');out.innerHTML=selected?(key==='tennis'?sportsTennisHtml(selected):sportsGenericModuleHtml(renderDoc)):sportsWorldCupHtml(d);}
fetch('./sports-public.json?t='+Date.now()).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(renderSports).catch(function(e){document.getElementById('sports-out').innerHTML='<div class="loading">Could not load sports data ('+esc(e.message)+'). Please try again shortly.</div>';});
</script>
