<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Cup — Projections</title>
<meta name="description" content="World Cup form, momentum and win/draw/loss projections. Framing only, not betting advice.">
<style>
  :root{
    --bg:#0e1116; --bg2:#161a21; --bg3:#1d222b; --rim:#262c37;
    --txt:#e8eaed; --txt2:#aab2bd; --txt3:#6b7480;
    --gold:#c9a84c; --green:#2db87a; --red:#e85c5c; --amber:#f0a832; --blue:#3498db;
    --serif:Georgia,'Times New Roman',serif; --mono:'SF Mono',Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:1.4rem 1.1rem 3rem}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;flex-wrap:wrap;border-bottom:1px solid var(--rim);padding-bottom:.9rem;margin-bottom:1.2rem}
  h1{font-family:var(--serif);font-size:24px;font-weight:700;margin:0}
  h1 .sub{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:.2rem}
  .asof{font-family:var(--mono);font-size:11px;color:var(--txt3);white-space:nowrap}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1.3rem}
  .kpi{background:var(--bg2);border:1px solid var(--rim);border-radius:10px;padding:.7rem .8rem}
  .kpi-l{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3)}
  .kpi-v{font-family:var(--serif);font-size:20px;font-weight:700;margin-top:.15rem;line-height:1.1}
  .kpi-s{font-family:var(--mono);font-size:9px;color:var(--txt3);margin-top:.15rem}
  .panel{margin-bottom:1.4rem}
  .panel-t{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);margin-bottom:.7rem}
  .confcalls{font-size:13px;color:var(--txt2);line-height:1.6;background:rgba(45,184,122,.1);border:1px solid rgba(45,184,122,.25);border-radius:8px;padding:.6rem .8rem;margin-bottom:.9rem}
  .confcalls b{color:var(--txt)}
  .match{background:var(--bg2);border:1px solid var(--rim);border-radius:10px;padding:.8rem .9rem;margin-bottom:.6rem}
  .match-meta{display:flex;justify-content:space-between;gap:.5rem;font-family:var(--mono);font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem}
  .team{font-family:var(--serif);font-size:16px;font-weight:700}
  .team.away{text-align:right}
  .score{font-family:var(--mono);font-size:13px;color:var(--txt3)}
  .proj{margin-top:.6rem;border-top:1px solid var(--rim);padding-top:.55rem}
  .proj.low{opacity:.62}
  .proj-main{font-size:12.5px;color:var(--txt2)}
  .proj-main b{color:var(--txt)}
  .lowconf{font-family:var(--mono);font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em}
  .elo{font-family:var(--mono);font-size:9px;color:var(--txt3)}
  .bar{display:flex;height:7px;border-radius:5px;overflow:hidden;background:var(--bg3);margin-top:.5rem}
  .bar span{height:100%}
  .bar .h{background:var(--green)} .bar .d{background:var(--txt3)} .bar .a{background:var(--blue)}
  .mom{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
  .mom-card{background:var(--bg2);border:1px solid var(--rim);border-left:4px solid var(--gold);border-radius:9px;padding:.7rem .8rem}
  .mom-card.rising{border-left-color:var(--green)} .mom-card.fading{border-left-color:var(--red)} .mom-card.watch{border-left-color:var(--amber)}
  .mom-top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
  .mom-team{font-family:var(--serif);font-size:15px;font-weight:700}
  .mom-score{font-family:var(--mono);font-size:20px;color:var(--gold)}
  .mom-tag{font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3)}
  .mom-note{font-size:11.5px;color:var(--txt2);margin-top:.35rem;line-height:1.5}
  .foot{border-top:1px solid var(--rim);margin-top:1.6rem;padding-top:1rem;font-family:var(--mono);font-size:10px;color:var(--txt3);line-height:1.7}
  .empty{font-size:12.5px;color:var(--txt3);font-style:italic}
  @media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.mom{grid-template-columns:1fr}.teams{grid-template-columns:1fr auto 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="sub">⚽ Live projections</span><span id="title">World Cup</span></h1>
    <div class="asof" id="asof"></div>
  </header>
  <div id="out"><div class="empty">Loading…</div></div>
  <div class="foot">
    Form &amp; momentum from football-data.org; team strength from World Football Elo (eloratings.net).
    Win/draw/loss are model estimates for framing — <b>not betting advice</b>, not guarantees.
    Refreshed daily.
  </div>
</div>
<script>
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
var pct = function(v){ return Math.round((v||0)*100); };
function sportsDate(v){
  if(!v) return 'TBD';
  var d = new Date(v); if(isNaN(d.getTime())) return String(v);
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
}
function statusLabel(s){ s=String(s||'').replace(/_/g,' ').toLowerCase(); return s?s.charAt(0).toUpperCase()+s.slice(1):'Scheduled'; }
function momClass(l){ l=String(l||'').toLowerCase(); return l==='rising'?'rising':(l==='fading'?'fading':(l==='watch'?'watch':'')); }

function projHtml(m){
  var p = m && m.projection;
  if(!p || !p.probs) return '';
  var h=pct(p.probs.home), dr=pct(p.probs.draw), a=pct(p.probs.away);
  var decisive = p.tag==='Strong edge' || p.tag==='Moderate edge';
  var favPct = p.favorite===m.home?h:(p.favorite===m.away?a:Math.max(h,a));
  var elo = (p.homeElo!=null&&p.awayElo!=null)?' <span class="elo">Elo '+p.homeElo+'–'+p.awayElo+'</span>':'';
  var split = esc(m.home)+' '+h+'% · draw '+dr+'% · '+esc(m.away)+' '+a+'%'+elo;
  var main = !p.favorite ? '<b>Too close to call</b> — '+split
    : decisive ? '<b>Projected: '+esc(p.favorite)+' '+favPct+'%</b> — '+split
    : '<b>Lean '+esc(p.favorite)+' '+favPct+'%</b> <span class="lowconf">low confidence</span> — '+split;
  return '<div class="proj'+(decisive?'':' low')+'"><div class="proj-main">'+main+'</div>'+
    '<div class="bar"><span class="h" style="width:'+h+'%"></span><span class="d" style="width:'+dr+'%"></span><span class="a" style="width:'+a+'%"></span></div></div>';
}
function matchCard(m){
  var s = m.score||{};
  var sc = (s.home==null&&s.away==null)?'vs':((s.home==null?'-':s.home)+' - '+(s.away==null?'-':s.away));
  return '<div class="match"><div class="match-meta"><span>'+esc(m.stage||m.group||'World Cup')+'</span>'+
    '<span>'+esc(sportsDate(m.utcDate))+' · '+esc(statusLabel(m.status))+'</span></div>'+
    '<div class="teams"><div class="team">'+esc(m.home||'TBD')+'</div><div class="score">'+esc(sc)+'</div>'+
    '<div class="team away">'+esc(m.away||'TBD')+'</div></div>'+ projHtml(m) +'</div>';
}
function confCalls(up){
  var calls=(up||[]).filter(function(m){var p=m.projection;return p&&p.favorite&&(p.tag==='Strong edge'||p.tag==='Moderate edge');})
    .map(function(m){var p=m.projection;var v=pct(p.favorite===m.home?p.probs.home:p.probs.away);return '<b>'+esc(p.favorite)+'</b> '+v+'%';});
  return calls.length ? '<div class="confcalls">🎯 Confident calls: '+calls.slice(0,8).join(' · ')+'</div>' : '';
}
function momCard(t){
  return '<div class="mom-card '+momClass(t.label)+'"><div class="mom-top"><div><div class="mom-team">'+esc(t.team)+'</div>'+
    '<div class="mom-tag">'+esc(t.label||'STEADY')+'</div></div><div class="mom-score">'+esc(t.score==null?'-':t.score)+'</div></div>'+
    '<div class="mom-note">'+esc(t.note||'')+'</div></div>';
}
function render(d){
  var wc = d.worldCup||{};
  document.getElementById('title').textContent = wc.name || 'World Cup';
  document.getElementById('asof').textContent = 'as of '+(d.asOf||'—');
  var matches = wc.matches||[];
  var finished = matches.filter(function(m){return String(m.status||'').toUpperCase()==='FINISHED';});
  var goals = finished.reduce(function(a,m){return a+((m.score&&m.score.home!=null)?Number(m.score.home||0)+Number(m.score.away||0):0);},0);
  var up = wc.upcoming||[], rec = wc.recent||[], next = up[0];
  var rising = (wc.risingTeams && wc.risingTeams.length ? wc.risingTeams : (wc.momentum||[])).slice(0,3);
  var html = '<div class="kpis">'+
    '<div class="kpi"><div class="kpi-l">Matches</div><div class="kpi-v">'+(matches.length||0)+'</div><div class="kpi-s">'+finished.length+' finished</div></div>'+
    '<div class="kpi"><div class="kpi-l">Goals</div><div class="kpi-v">'+goals+'</div><div class="kpi-s">'+(finished.length?(goals/finished.length).toFixed(2)+'/match':'—')+'</div></div>'+
    '<div class="kpi"><div class="kpi-l">Upcoming</div><div class="kpi-v">'+up.length+'</div><div class="kpi-s">fixtures projected</div></div>'+
    '<div class="kpi"><div class="kpi-l">Next</div><div class="kpi-v" style="font-size:13px">'+esc(next?sportsDate(next.utcDate):'TBD')+'</div><div class="kpi-s">'+esc(next?((next.home||'TBD')+' v '+(next.away||'TBD')):'—')+'</div></div>'+
  '</div>';
  html += '<div class="panel"><div class="panel-t">Next Fixtures — projected outcome</div>'+ confCalls(up) +
    (up.length ? up.slice(0,10).map(matchCard).join('') : '<div class="empty">No upcoming fixtures loaded.</div>') +'</div>';
  html += '<div class="panel"><div class="panel-t">Rising Teams</div>'+
    (rising.length ? '<div class="mom">'+rising.map(momCard).join('')+'</div>' : '<div class="empty">Momentum needs completed matches.</div>') +'</div>';
  html += '<div class="panel"><div class="panel-t">Recent Results</div>'+
    (rec.length ? rec.slice(0,6).map(matchCard).join('') : '<div class="empty">No completed matches yet.</div>') +'</div>';
  document.getElementById('out').innerHTML = html;
}
fetch('./sports-public.json?t='+Date.now()).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(render)
  .catch(function(e){ document.getElementById('out').innerHTML = '<div class="empty">Could not load sports data ('+esc(e.message)+'). Please try again shortly.</div>'; });
</script>
</body>
</html>
