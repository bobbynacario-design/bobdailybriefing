# One-off: the Markets panel on several Claude models over ONE new fact sheet.
# Lives only on the miro-model-compare branch (never merged). Writes nothing.
name: Markets model comparison
on:
  push:
    branches: [miro-model-compare]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: miro/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - run: npm --prefix miro ci
      - name: One fact sheet, four models
        working-directory: miro
        run: node compare-models.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
