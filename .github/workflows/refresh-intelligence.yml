name: Refresh intelligence feeds

on:
  schedule:
    # GitHub cron is UTC. PHT is UTC+8.
    - cron: "45 19 * * *"    # News 03:45 PHT daily (lands before the morning briefing even when late)
    - cron: "15 20 * * *"    # Grounding releases 04:15 PHT daily (after news)
    - cron: "45 21 * * *"    # News catch-up 05:45 PHT daily
    - cron: "0 22 * * 0-4"   # Radar 06:00 PHT Monday-Friday
    - cron: "15 22 * * *"    # Markets 06:15 PHT daily
    - cron: "45 0 * * *"     # News catch-up 08:45 PHT daily
    - cron: "30 0 * * 1-5"   # Radar catch-up 08:30 PHT Monday-Friday
  workflow_dispatch:
    inputs:
      feed:
        description: Feed to refresh
        required: true
        default: radar
        type: choice
        options: [radar, markets, news, grounding]
      force:
        # Radar only. A manual run normally no-ops once today's radar doc exists;
        # this re-scores and overwrites it (one OpenAI catalyst call), e.g. to put
        # a scoring change live the same day.
        description: Radar only - re-run even if today's radar is already written
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # News runs FIRST at 03:45 PHT. GitHub's scheduled runs start late, often by
  # two to three hours: the 05:45 slot this job used to rely on was landing at
  # about 08:10 PHT, after Bob's morning briefing, so the briefing was grounded
  # on the previous day's list (found 27 Sep 2026, when that day's list still
  # lacked the network and trucking feeds added the evening before). An 03:45
  # start still lands ahead of a 06:00-07:00 briefing and deliverMorningFive's
  # 06:00-11:30 PHT checks even when it is that late.
  #
  # The catch-ups at 05:45 and 08:45 PHT are free: refresh-news is a no-op when
  # today's doc already exists, so they exit as 'skipped' without fetching after
  # a successful earlier run, and recover a failed or skipped one.
  #
  # No OPENAI_API_KEY here, deliberately: this feed makes no model call, and
  # handing it a key it does not use would obscure that.
  news:
    if: github.event.schedule == '45 19 * * *' || github.event.schedule == '45 21 * * *' || github.event.schedule == '45 0 * * *' || github.event.inputs.feed == 'news'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: refresh-news
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: news/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - run: npm --prefix news ci
      - run: npm --prefix news run refresh

  # Grounding releases for BI-Assessor and RiskM8 (docs/grounding-roadmap.md,
  # Phase D). Daily at 04:15 PHT. Each series in grounding/series.js keeps its
  # own cadence, so the publisher only fetches the series that are due; manual
  # captures (grounding/manual/) are read every run.
  #
  # A release is cut only when published content changed. It is committed to
  # the orphan grounding-data branch, never to main, so Bob's pushes are never
  # affected. Releases are immutable: the publisher refuses to overwrite one.
  # This is the only job with write access, and it uses it for that branch only.
  grounding:
    if: github.event.schedule == '15 20 * * *' || github.event.inputs.feed == 'grounding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: refresh-grounding
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check out the grounding-data branch (created empty on the first run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin grounding-data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch grounding-data "$url" gdata
          else
            mkdir gdata
            git -C gdata init --quiet --initial-branch grounding-data
            git -C gdata remote add origin "$url"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: grounding/publisher/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - run: npm --prefix grounding/publisher ci
      - id: publish
        run: node grounding/publisher/publish.js --data-dir gdata --defer-mirror --pending-file "$RUNNER_TEMP/grounding-pending.json"
      - name: Commit and push a new release
        if: steps.publish.outputs.released == 'true'
        env:
          SEQUENCE: ${{ steps.publish.outputs.sequence }}
        run: |
          cd gdata
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Grounding release ${SEQUENCE}"
          git push --quiet origin HEAD:grounding-data
      - name: Mirror the published release and record run health
        run: node grounding/publisher/publish.js --data-dir gdata --mirror-only --pending-file "$RUNNER_TEMP/grounding-pending.json"

  radar:
    if: github.event.schedule == '0 22 * * 0-4' || github.event.schedule == '30 0 * * 1-5' || github.event.inputs.feed == 'radar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: refresh-radar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: radar/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - run: npm --prefix radar ci
      - run: npm --prefix radar run refresh
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          # Catalysts and focus reads run on Claude (radar/catalysts.js).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Empty on scheduled runs; '1' only for a manual run with force ticked.
          RADAR_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}

  markets:
    if: github.event.schedule == '15 22 * * *' || github.event.inputs.feed == 'markets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: refresh-markets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: miro/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - run: npm --prefix miro ci
      - run: npm --prefix miro run refresh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
