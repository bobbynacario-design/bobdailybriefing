name: Refresh clothing deals
on:
  schedule:
    # Monday and Thursday, 08:00 Philippine time. No AI or paid data API.
    - cron: '0 0 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-clothing
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flights/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - run: npm --prefix flights ci
      - name: Install the standard Chromium renderer
        working-directory: flights
        run: npx playwright install --with-deps chromium
      - run: node flights/refresh-clothing.js
        env:
          CLOTHING_BROWSER: '1'
