# One-off checks of the Markets panel. Lives only on the miro-panel-test
# branch (never merged). Dry runs: nothing is written to Firestore.
name: Markets panel model test
on:
  push:
    branches: [miro-panel-test]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: miro/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - run: npm --prefix miro ci
      - name: Full flow as configured (fact sheet + Haiku panel + move notes), dry run
        working-directory: miro
        run: node refresh-miro.js --dry-run --force-panel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
