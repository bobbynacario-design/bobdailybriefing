name: Publish static app

on:
  push:
    branches: [main]
    paths:
      - index.html
      - sports.html
      - sports-public.json
      - offline.html
      - manifest.webmanifest
      - sw.js
      - assets/**
      - reports/**
      - scripts/**
      - package.json
      - lib/**
      - lib/command-center-core.js
      - lib/command-review-core.js
      - lib/intelligence-search-core.js
      - lib/evidence-sets-core.js
      - lib/entity-timeline-core.js
      - .github/workflows/publish-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sports-pages-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and verify release artifact
        run: npm run check:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
