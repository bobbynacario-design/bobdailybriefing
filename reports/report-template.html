<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF8F3">
<meta name="description" content="Deep-research briefing: insurance and business-interruption exposure from the 08 June 2026 Mw 7.8 offshore Sarangani earthquake, Mindanao, Philippines. Prepared for Bob.">
<title>{{TITLE}}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Light editorial (default) */
  --paper:#FAF8F3;--surface:#FFFFFF;--surface2:#F3F0E7;
  --ink:#1B1815;--ink2:rgba(27,24,21,.64);--ink3:rgba(27,24,21,.42);
  --line:rgba(40,32,16,.10);--line2:rgba(40,32,16,.16);--line3:rgba(40,32,16,.30);
  --gold:#8A6A16;--gold2:#A8842A;--gold-dim:rgba(138,106,22,.10);
  --green:#1A7A40;--green-dim:rgba(26,122,64,.10);
  --red:#BC3B2C;--red-dim:rgba(188,59,44,.09);
  --blue:#1F6FA8;--blue-dim:rgba(31,111,168,.10);
  --purple:#6C3FB0;--purple-dim:rgba(108,63,176,.10);
  --teal:#0E8C8C;
  --shadow:0 1px 2px rgba(30,24,12,.05),0 10px 30px rgba(30,24,12,.05);
  --serif:'Playfair Display',Georgia,serif;
  --mono:'DM Mono','Courier New',monospace;
  --sans:'DM Sans',system-ui,sans-serif;
}
body.dark{
  --paper:#080A0E;--surface:#0F1218;--surface2:#161B24;
  --ink:#fff;--ink2:rgba(255,255,255,.62);--ink3:rgba(255,255,255,.4);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--line3:rgba(255,255,255,.24);
  --gold:#C9A84C;--gold2:#E8C97A;--gold-dim:rgba(201,168,76,.14);
  --green:#2DB87A;--green-dim:rgba(45,184,122,.14);
  --red:#E85C5C;--red-dim:rgba(232,92,92,.14);
  --blue:#3498DB;--blue-dim:rgba(52,152,219,.14);
  --purple:#9B6FE8;--purple-dim:rgba(155,111,232,.14);
  --teal:#1EC8C8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.4);
}
html{scroll-behavior:smooth}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
body{line-height:1.58;font-weight:400}
::selection{background:var(--gold-dim);color:var(--ink)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:200;transition:width .1s linear}

/* topbar */
.topbar{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem clamp(20px,4vw,44px)}
.brand{font-family:var(--serif);font-size:18px;font-weight:800;color:var(--gold);white-space:nowrap}
.brand span{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-left:.55rem;letter-spacing:.14em;text-transform:uppercase}
.tb-actions{display:flex;gap:.5rem;align-items:center}
.tb-btn{font-family:var(--mono);font-size:10px;padding:.4rem .7rem;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.tb-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
@media(max-width:560px){.brand span{display:none}.tb-btn{padding:.35rem .55rem;letter-spacing:.05em}}

/* page grid */
.page{max-width:1580px;margin:0 auto;padding:1.6rem clamp(20px,3vw,44px) 4rem;display:grid;grid-template-columns:248px minmax(0,1fr);gap:clamp(30px,3.5vw,56px);align-items:start}
main{grid-column:2;min-width:0}
.sidebar{grid-column:1;grid-row:1;position:sticky;top:74px;display:flex;flex-direction:column;gap:1.5rem}
@media(max-width:1080px){.page{grid-template-columns:1fr;padding-top:1rem;gap:0}main{grid-column:1}.sidebar{display:none}}

/* sidebar blocks */
.side-h{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:.75rem}
.toc a{display:flex;gap:.55rem;font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-decoration:none;padding:.42rem 0 .42rem .8rem;border-left:2px solid var(--line2);transition:all .15s;line-height:1.3}
.toc a span{color:var(--ink3);font-size:10px;min-width:14px}
.toc a:hover{color:var(--ink)}
.toc a.active{color:var(--gold);border-left-color:var(--gold);font-weight:500}
.toc a.active span{color:var(--gold)}
.side-meta .row{display:flex;flex-direction:column;gap:.12rem;padding:.5rem 0;border-top:1px solid var(--line)}
.side-meta .row:first-of-type{border-top:none}
.side-meta .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.side-meta .v{font-family:var(--mono);font-size:11px;color:var(--ink)}
.side-legend{display:flex;flex-direction:column;gap:.45rem;align-items:flex-start}

/* badges */
.badge{display:inline-flex;align-items:center;gap:.4rem;padding:.28rem .6rem;border-radius:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase}
.badge.fact{color:var(--green);background:var(--green-dim);border:1px solid color-mix(in srgb,var(--green) 35%,transparent)}
.badge.est{color:var(--purple);background:var(--purple-dim);border:1px dashed color-mix(in srgb,var(--purple) 45%,transparent)}

/* masthead */
.masthead{position:relative;padding:.4rem 0 1.3rem;border-bottom:1px solid var(--line2);margin-bottom:1.3rem;overflow:hidden}
.masthead .seis{position:absolute;right:0;bottom:14px;width:44%;height:74px;opacity:.2;pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;position:relative}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--red-dim);animation:pulse 2.4s ease-in-out infinite}
h1.title{font-family:var(--serif);font-weight:800;font-size:clamp(1.7rem,3.2vw,2.65rem);line-height:1.08;letter-spacing:-.015em;margin:.65rem 0 .7rem;max-width:24ch;position:relative}
.dek{font-size:1.02rem;color:var(--ink2);max-width:68ch;line-height:1.55;position:relative}
.dek strong{color:var(--ink);font-weight:600}
.byline{display:flex;flex-wrap:wrap;gap:.45rem .55rem;margin-top:1.05rem;position:relative}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:.34rem .7rem;white-space:nowrap}
.chip b{color:var(--gold);font-weight:500}
.chip.live{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}

/* ticker */
.ticker{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);margin-bottom:1.9rem}
.tick{padding:.85rem 1rem;border-right:1px solid var(--line)}
.tick:last-child{border-right:none}
.tick .lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin-bottom:.35rem}
.tick .val{font-family:var(--serif);font-size:1.5rem;font-weight:700;line-height:1;color:var(--ink)}
.tick .val small{font-size:.9rem;color:var(--ink2);font-family:var(--mono);font-weight:400}
.tick .sub{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:.32rem}
@media(max-width:880px){.ticker{grid-template-columns:repeat(3,1fr)}.tick{border-bottom:1px solid var(--line)}}
@media(max-width:480px){.ticker{grid-template-columns:repeat(2,1fr)}}

/* sections */
section{scroll-margin-top:74px;margin-bottom:2.7rem}
.sec-head{display:flex;align-items:baseline;gap:.8rem;border-bottom:2px solid var(--ink);padding-bottom:.5rem;margin-bottom:1.2rem}
.sec-num{font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:500}
h2.sec-title{font-family:var(--serif);font-weight:700;font-size:clamp(1.3rem,2vw,1.8rem);line-height:1.12;letter-spacing:-.01em}
h3{font-family:var(--serif);font-weight:700;font-size:1.16rem;margin:1.6rem 0 .55rem;color:var(--ink)}

article p{margin:0 0 .95rem;font-size:1rem;color:var(--ink);line-height:1.66;max-width:76ch}
article p strong{font-weight:600}
.lead{font-size:1.06rem}
.lead.first::first-letter{font-family:var(--serif);font-weight:800;float:left;font-size:3.2rem;line-height:.82;padding:.35rem .55rem 0 0;color:var(--gold)}
ul.clean{margin:0 0 1.1rem;padding:0;list-style:none;max-width:76ch}
ul.clean li{position:relative;padding-left:1.4rem;margin-bottom:.55rem;font-size:1rem;line-height:1.6}
ul.clean li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
ul.clean li strong{font-weight:600}

/* callouts */
.callout{max-width:80ch;border-radius:11px;padding:1rem 1.2rem;margin:1.3rem 0;background:var(--surface);border:1px solid var(--line2);border-left:3px solid var(--gold);box-shadow:var(--shadow)}
.callout .ck{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:.45rem}
.callout p{margin:0;font-size:.98rem;line-height:1.6;max-width:none}
.callout.quote p{font-family:var(--serif);font-style:italic;font-size:1.18rem;line-height:1.45;color:var(--ink)}
.callout.estimate{border-left:3px dashed var(--purple)}
.callout.estimate .ck{color:var(--purple)}
.bottomline{border-radius:12px;padding:1.3rem 1.5rem;margin:1.8rem 0 1rem;background:linear-gradient(135deg,var(--gold-dim),transparent),var(--surface);border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);box-shadow:var(--shadow)}
.bottomline .ck{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.55rem;display:flex;align-items:center;gap:.5rem}
.bottomline p{margin:0;font-size:1.06rem;line-height:1.62;max-width:84ch}

/* formula */
.formula{font-family:var(--mono);font-size:.92rem;line-height:1.7;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:1rem 1.2rem;margin:1rem 0;color:var(--ink2);max-width:90ch}
.formula b{color:var(--gold);font-weight:500}

/* diagrams — always-light figure panel (pairs with light mermaid theme) */
.diagram{background:#FFFFFF;border:1px solid rgba(40,32,16,.14);border-radius:14px;padding:1.4rem 1rem .7rem;margin:1.5rem 0;overflow-x:auto;box-shadow:0 1px 2px rgba(30,24,12,.05),0 10px 30px rgba(30,24,12,.06)}
.diagram .mermaid{display:flex;justify-content:center;min-width:460px}
.diagram figcaption{font-family:var(--mono);font-size:10.5px;color:#6E665A;text-align:center;padding:.7rem 1rem 0;line-height:1.5;border-top:1px solid rgba(40,32,16,.1);margin:.6rem auto 0;max-width:84ch}
.dlabel{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8A6A16;padding:0 .4rem .9rem}
@media(max-width:560px){.diagram .mermaid{min-width:300px}}

/* tables */
.table-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line2);margin:1.4rem 0;box-shadow:var(--shadow)}
table.data{width:100%;border-collapse:collapse;font-size:.92rem;min-width:600px;background:var(--surface)}
table.data caption{caption-side:top;text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:.55rem .9rem}
table.data th{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:.8rem 1rem;border-bottom:2px solid var(--line2);background:var(--surface2);font-weight:500;vertical-align:bottom}
table.data td{padding:.8rem 1rem;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
table.data tbody tr:last-child td{border-bottom:none}
table.data tbody tr:nth-child(even){background:var(--surface2)}
table.data tbody tr:hover{background:var(--gold-dim)}
table.data td.k{font-weight:600;color:var(--ink)}
table.data td .fig{font-family:var(--mono);font-size:.9rem;color:var(--gold)}
table.data td .src{font-family:var(--mono);font-size:10px;color:var(--ink3)}
table.data strong{font-weight:600;color:var(--ink)}

/* site cards */
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));margin:1.4rem 0}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:13px;padding:1.1rem 1.2rem;box-shadow:var(--shadow);transition:border-color .2s,transform .15s,box-shadow .2s}
.card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 26px rgba(30,24,12,.1)}
.card .pri{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;padding:.24rem .55rem;border-radius:5px;display:inline-block;margin-bottom:.7rem;font-weight:500}
.pri.vh{color:var(--red);background:var(--red-dim);border:1px solid color-mix(in srgb,var(--red) 32%,transparent)}
.pri.h{color:var(--gold);background:var(--gold-dim);border:1px solid color-mix(in srgb,var(--gold) 32%,transparent)}
.pri.mh{color:var(--blue);background:var(--blue-dim);border:1px solid color-mix(in srgb,var(--blue) 32%,transparent)}
.pri.m{color:var(--teal);background:rgba(14,140,140,.08);border:1px solid rgba(14,140,140,.3)}
.card h4{font-family:var(--serif);font-size:1.1rem;font-weight:700;line-height:1.2;margin-bottom:.2rem;color:var(--ink)}
.card .loc{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.02em;margin-bottom:.7rem}
.card .fld{margin-bottom:.6rem}
.card .fld .fl{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem}
.card .fld p{font-size:.86rem;margin:0;line-height:1.5;color:var(--ink2);max-width:none}
.card .fld p strong{color:var(--ink);font-weight:600}
.srcs{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.6rem}
.srcs .s{font-family:var(--mono);font-size:8.5px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:.2rem .45rem}

/* scenarios */
.scen{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));margin:1.4rem 0}
.scard{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:1.2rem;border-top:4px solid var(--line3);box-shadow:var(--shadow)}
.scard.best{border-top-color:var(--green)}
.scard.likely{border-top-color:var(--gold)}
.scard.worst{border-top-color:var(--red)}
.scard .nm{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.7rem}
.scard.best .nm{color:var(--green)}.scard.likely .nm{color:var(--gold)}.scard.worst .nm{color:var(--red)}
.scard .narr{font-size:.86rem;color:var(--ink2);line-height:1.5;margin-bottom:.9rem}
.scard .row{display:flex;justify-content:space-between;align-items:baseline;padding:.45rem 0;border-top:1px solid var(--line)}
.scard .row .l{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.scard .row .v{font-family:var(--mono);font-size:.95rem;color:var(--ink);font-weight:500}
.scard .row .v.share{color:var(--gold)}
.scard .ka{font-size:.82rem;color:var(--ink3);line-height:1.45;margin-top:.7rem;font-style:italic}

/* footer */
footer{border-top:2px solid var(--ink);padding:1.8rem 0 1rem;margin-top:1.6rem}
footer .fk{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
footer p{font-size:.9rem;color:var(--ink2);max-width:80ch;margin-bottom:1rem;line-height:1.6}
.agencies{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.agencies .a{font-family:var(--mono);font-size:9.5px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:.3rem .6rem;letter-spacing:.03em}
.foot-meta{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:1.3rem;letter-spacing:.04em}

@media print{
  .topbar,#progress,.sidebar,.tb-btn{display:none!important}
  .page{display:block;max-width:none;padding:0}
  body{background:#fff}
  .card,.scard,.callout,.bottomline,.diagram,.table-scroll{break-inside:avoid}
}
</style>
</head>
<body>
<div id="progress"></div>

<header class="topbar">
  <div class="brand">Deep&nbsp;Research<span>Catastrophe &amp; BI Intelligence</span></div>
  <div class="tb-actions">
    <button class="tb-btn" id="themeBtn" title="Toggle theme">◐ Theme</button>
    <button class="tb-btn" onclick="window.print()" title="Save as PDF / print">⎙ Save&nbsp;PDF</button>
  </div>
</header>

<div class="page">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <nav class="toc" aria-label="Contents">
      <div class="side-h">Contents</div>
      {{TOC}}
    </nav>
    <div class="side-meta">
      <div class="side-h">At a glance</div>
      {{META}}
    </div>
    <div class="side-legend">
      <div class="side-h">Legend</div>
      <span class="badge fact">● Official fact</span>
      <span class="badge est">◆ Analytical estimate</span>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <div class="masthead">
      <svg class="seis" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <polyline fill="none" stroke="#B89030" stroke-width="1.6" opacity="0.9"
          points="0,60 90,60 130,58 170,62 210,40 230,92 250,18 268,104 286,52 320,60 360,59 400,61 440,30 458,98 476,12 494,110 512,48 540,60 600,60 660,59 700,61 740,44 758,88 776,26 794,100 812,54 850,60 920,60 980,59 1020,61 1060,50 1078,80 1096,38 1114,82 1132,56 1160,60 1200,60"/>
      </svg>
      <div class="eyebrow"><span class="dot"></span> {{EYEBROW}}</div>
      <h1 class="title">{{TITLE}}</h1>
      <p class="dek">{{DEK}}</p>
      <div class="byline">{{BYLINE}}</div>
    </div>

    {{TICKER}}

    <article>
{{BODY}}
      </article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
// Mermaid — light figure theme (diagram panels stay light in both page themes)
mermaid.initialize({
  startOnLoad:false,
  securityLevel:'loose',
  theme:'base',
  fontFamily:"'DM Mono','Courier New',monospace",
  themeVariables:{
    background:'#ffffff',
    primaryColor:'#FBF4DF',
    primaryBorderColor:'#8A6A16',
    primaryTextColor:'#1B1815',
    secondaryColor:'#F0ECE2',
    tertiaryColor:'#F7F5F0',
    lineColor:'#9A7B2E',
    textColor:'#33302A',
    titleColor:'#7A5E12',
    // timeline — soft tinted sections with dark labels
    cScale0:'#E7D6A4',cScale1:'#CFE0EF',cScale2:'#CFE9D9',cScale3:'#F1D6D3',cScale4:'#E0D2F0',
    cScaleLabel0:'#1B1815',cScaleLabel1:'#1B1815',cScaleLabel2:'#1B1815',cScaleLabel3:'#1B1815',cScaleLabel4:'#1B1815',
    // xychart
    xyChart:{
      backgroundColor:'transparent',
      titleColor:'#7A5E12',
      xAxisLabelColor:'#33302A',xAxisTitleColor:'#8A6A16',xAxisTickColor:'#cfc9bb',xAxisLineColor:'#cfc9bb',
      yAxisLabelColor:'#33302A',yAxisTitleColor:'#8A6A16',yAxisTickColor:'#cfc9bb',yAxisLineColor:'#cfc9bb',
      plotColorPalette:'#8A6A16,#BC3B2C'
    }
  }
});

// Render each diagram individually; if one has bad syntax (common in
// machine-generated mermaid), fall back to readable source instead of a
// jarring error graphic so the rest of the report stays clean.
(function(){
  var blocks=[].slice.call(document.querySelectorAll('pre.mermaid'));
  blocks.forEach(function(el,i){
    var src=el.textContent;
    mermaid.render('mmd-'+i, src).then(function(out){
      el.innerHTML=out.svg;
      if(out.bindFunctions) out.bindFunctions(el);
    }).catch(function(){
      var pre=document.createElement('pre');
      pre.textContent=src.trim();
      pre.style.cssText="font-family:var(--mono);font-size:11px;line-height:1.6;white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:1rem 1.1rem;margin:0;overflow:auto;color:var(--ink2)";
      var fig=el.closest('figure.diagram'); if(fig){ fig.querySelector('.dlabel')&&fig.querySelector('.dlabel').remove(); }
      el.replaceWith(pre);
    });
  });
})();

// Theme toggle (light default; toggles to dark)
document.getElementById('themeBtn').addEventListener('click',function(){document.body.classList.toggle('dark');});

// Reading progress
var prog=document.getElementById('progress');
function onScroll(){var h=document.documentElement;var max=h.scrollHeight-h.clientHeight;prog.style.width=(max>0?(h.scrollTop/max*100):0)+'%';}
document.addEventListener('scroll',onScroll,{passive:true});onScroll();

// TOC scroll-spy
var links=[].slice.call(document.querySelectorAll('.toc a'));
var map={};links.forEach(function(a){map[a.getAttribute('href').slice(1)]=a;});
var spy=new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if(e.isIntersecting){
      links.forEach(function(a){a.classList.remove('active');});
      var a=map[e.target.id];if(a)a.classList.add('active');
    }
  });
},{rootMargin:'-15% 0px -75% 0px'});
document.querySelectorAll('article section').forEach(function(s){spy.observe(s);});
</script>
</body>
</html>
